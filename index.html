<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTrack - Sua biblioteca de jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GAME TRACK</h1>
            <p>Sua biblioteca de Jogos</p>
        </header>
        
        <selection class="dashboard">
            <div class="card-total">
                <h3 id="total-jogos">0</h3>
                <p>Jogos cadastrados</p>
            </div>
            <div class="card-jogando">
                <h3 id="total-jogando">0</h3>
                <p>Jogando</p>
            </div>
            <div class="card-finalizado">
                <h3 id="total-finalizados">0</h3>
                <p>Finalizados</p>
            </div>
        </selection>

        <section class="form-section">
            <h2 id="form-titulo">Cadastrar Novo Jogo</h2>
            <form id="game-form">
                <input type="hidden" id="game-id">
                
                <div class="input-group">
                    <input type="text" id="titulo" placeholder="Título do jogo" required>
                    <input type="text" id="genero" placeholder="Gênero" required>
                </div>

                <div class="input-group">
                    <input type="text" id="plataforma" placeholder="Plataforma (ex: PC, Xbox)" required>
                    <input type="number" id="nota" placeholder="Nota (0 a 10)" min="0" max="10" required>
                    <select id="status" required>
                        <option value="">Selecione o status</option>
                        <option value="Quero jogar">Quero jogar</option>
                        <option value="Jogando">Jogando</option>
                        <option value="Finalizado">Finalizado</option>
                        <option value="Abandonado">Abandonado</option>
                    </select>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="btn-salvar">Salvar Jogo</button>
                    <button type="button" id="btn-cancelar" style="display:none;">Cancelar Edição</button>
                </div>
                <p id="mensagem-erro" class="erro"></p>
            </form>
        </section>

        <section class="filters-section">
            <input type="text" id="input-pesquisa" placeholder="Pesquisar jogo...">
            <select id="filtro-status">
                <option value="Todos">Todos os Status</option>
                <option value="Quero jogar">Quero jogar</option>
                <option value="Jogando">Jogando</option>
                <option value="Finalizado">Finalizado</option>
                <option value="Abandonado">Abandonado</option>
            </select>
        </section>

        <div id="erro-conexao" class="erro-conexao" style="display:none;">
            Não foi possível conectar com a API. Verifica se o JSON Server está ligado.
        </div>

        <section id="lista-jogos" class="jogos-grid">
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
